name: Generate Profile Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-cards/**"
      - "metrics.svg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_cards.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-cards/
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
